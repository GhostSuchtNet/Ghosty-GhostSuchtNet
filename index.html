<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Ghost AI – KI-Chat von GhostSucht.Net" data-i18n-attr="content:ghosty.description">
  <title data-i18n="ghosty.title">Ghost AI – GhostSucht.Net</title>
  <link rel="stylesheet" href="/projects/style.css">
  <link rel="stylesheet" href="./style.css?v=20260902-tools-v3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.css">
  <link rel="stylesheet" href="/assets/site-theme.css">
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <script src="/assets/i18n/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"></script>

  <style id="ghosty-auth-styles">
    .ghosty-auth-hidden { display: none !important; }

    /* Der Auth-Layer liegt transparent über dem normalen Seitenhintergrund.
       Dadurch bleibt exakt der Farblook aus /projects/style.css, ./style.css
       und /assets/site-theme.css sichtbar. */
    .ghosty-auth-gate {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: transparent;
      color: var(--chat-text);
    }

    /* Normales Login: gleicher grün/dunkler Look wie Ghosty. */
    .ghosty-auth-card {
      width: min(430px, 100%);
      padding: 28px;
      border: 1px solid var(--chat-border);
      border-radius: 18px;
      background:
        linear-gradient(165deg, rgba(34, 197, 94, .20), rgba(250, 204, 21, .05)),
        rgba(4, 18, 24, .94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
      color: var(--chat-text);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .ghosty-auth-card h1 { margin: 0 0 8px; font-size: 1.65rem; }
    .ghosty-auth-card p { margin: 0 0 20px; color: var(--chat-muted); opacity: 1; }

    .ghosty-auth-card input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--chat-border);
      border-radius: 11px;
      background: rgba(2, 6, 23, .76);
      color: var(--chat-text);
      font: inherit;
      outline: none;
    }

    .ghosty-auth-card input:focus {
      border-color: var(--chat-accent);
      outline: 3px solid rgba(74, 222, 128, .25);
    }

    .ghosty-auth-card button {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      border: 1px solid rgba(134, 239, 172, .5);
      border-radius: 11px;
      background: linear-gradient(135deg, var(--chat-accent), var(--chat-accent-strong));
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .ghosty-auth-error {
      min-height: 22px;
      margin-top: 12px;
      color: var(--chat-danger);
      font-size: .9rem;
    }

    /* IP-Sperre: bewusst rot, beide Texte dunkelrot. */
    .ghosty-auth-card.ghosty-auth-blocked {
      border-color: #ef4444;
      background: linear-gradient(145deg, #fecaca, #f87171);
      box-shadow: 0 24px 70px rgba(127, 29, 29, .25);
      backdrop-filter: none;
    }

    .ghosty-auth-blocked h1 {
      color: #7f1d1d;
    }

    .ghosty-auth-blocked p {
      margin-bottom: 0;
      color: #7f1d1d;
      opacity: 1;
      font-weight: 650;
    }
  </style>

</head>
<body>
<div class="ghosty-auth-gate" id="ghostyAuthGate">
  <section class="ghosty-auth-card" id="ghostyAuthLogin" aria-labelledby="ghostyAuthTitle">
    <h1 id="ghostyAuthTitle">👻 Ghosty</h1>
    <p>Zugang nur mit gültigem Zugangscode.</p>
    <input id="ghostyAccessCode" type="password" autocomplete="off" placeholder="GHST_..." maxlength="200" aria-label="Zugangscode">
    <button id="ghostyLoginButton" type="button">Anmelden</button>
    <div class="ghosty-auth-error" id="ghostyAuthError" aria-live="polite"></div>
  </section>

  <section class="ghosty-auth-card ghosty-auth-blocked" id="ghostyAuthBlocked" hidden aria-live="assertive">
    <h1>Zugriff derzeit verweigert!</h1>
    <p>Bitte versuche es später erneut!</p>
  </section>
</div>

<div class="ghosty-layout ghosty-auth-hidden" id="ghostyApp">
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
  <aside class="chat-sidebar" id="chatSidebar" aria-label="Chatliste" data-i18n-attr="aria-label:ghosty.chatList">
    <div class="sidebar-head">
      <div>
        <span class="sidebar-kicker">GhostSucht.Net</span>
        <strong>Ghost AI</strong>
      </div>
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Menü schließen" data-i18n-attr="aria-label:ghosty.closeMenu">×</button>
    </div>
    <button class="new-chat" id="newChat" type="button" data-i18n="ghosty.newChat">＋ Neuer Chat</button>
    <nav class="chat-navigation" aria-label="Chats" data-i18n-attr="aria-label:ghosty.chatList">
      <section class="chat-group">
        <h2 data-i18n="ghosty.today">Heute</h2>
        <div id="todayChats" class="chat-list"></div>
      </section>
      <section class="chat-group">
        <h2 data-i18n="ghosty.older">Älter</h2>
        <div id="olderChats" class="chat-list"></div>
      </section>
    </nav>
    <button class="trash-toggle" id="trashToggle" type="button" aria-expanded="false">
      <span data-i18n="ghosty.archiveTrash">🗑 Archiv / Papierkorb</span>
      <span id="trashCount" class="count-badge">0</span>
    </button>
    <section class="trash-panel" id="trashPanel" hidden>
      <div id="trashChats" class="trash-list"></div>
    </section>
  </aside>

  <main class="app">
    <header class="top">
      <button class="menu-button" id="sidebarOpen" type="button" aria-label="Chatmenü öffnen" data-i18n-attr="aria-label:ghosty.openMenu">☰</button>
      <div class="brand">
        <span class="hero-badge">GhostSucht.Net</span>
        <h1>Ghost AI</h1>
      </div>
      <div class="control">
        <label for="model" data-i18n="ghosty.model">Modell</label>
        <select id="model"></select>
      </div>
      <div class="control">
        <label for="thinking" data-i18n="ghosty.thinking">Denkmodus</label>
        <select id="thinking">
          <option value="instant" data-i18n="ghosty.instant">Sofort</option>
          <option value="low" data-i18n="ghosty.low">Niedrig</option>
          <option value="medium" selected data-i18n="ghosty.medium">Mittel</option>
          <option value="high" data-i18n="ghosty.high">Hoch</option>
        </select>
      </div>
      <div class="control">
        <label for="webMode" data-i18n="ghosty.web">Web</label>
        <select id="webMode">
          <option value="auto" selected data-i18n="ghosty.webAuto">Automatisch</option>
          <option value="always" data-i18n="ghosty.webAlways">Immer</option>
          <option value="off" data-i18n="ghosty.webOff">Aus</option>
        </select>
      </div>
      <button id="clear" type="button" data-i18n="ghosty.clearChat">Chat löschen</button>
      <button id="ghostyLogout" type="button">Abmelden</button>
      <a class="project-link" href="/projects/" data-i18n="ghosty.backToProjects">Projekte</a>
      <div class="status" id="status" data-i18n="ghosty.loadingModels">Modelle werden geladen …</div>
    </header>

    <section id="chat" aria-live="polite" aria-label="Chat" data-i18n-attr="aria-label:ghosty.chat"></section>

    <div class="attachment-tray" id="attachmentTray" hidden aria-label="Anhänge" data-i18n-attr="aria-label:ghosty.attachments">
      <div id="attachmentList" class="attachment-list"></div>
    </div>

    <div class="tool-chips" id="toolChips" hidden aria-label="Aktivierte Werkzeuge" data-i18n-attr="aria-label:ghosty.activeTools"></div>

    <div class="recording-panel" id="recordingPanel" hidden aria-live="polite">
      <span class="recording-dot" aria-hidden="true"></span>
      <strong data-i18n="ghosty.recordingRunning">Aufnahme läuft</strong>
      <time id="recordingTime">00:00</time>
      <button id="recordingStop" type="button" data-i18n="ghosty.stopRecording">Stoppen</button>
    </div>

    <div class="composer">
      <input id="file" type="file" multiple accept=".pdf,.docx,.pptx,.xlsx,.csv,.txt,.md,.json,.xml,.yaml,.yml,.html,.htm,.css,.js,.mjs,.cjs,.ts,.tsx,.jsx,.java,.kt,.kts,.py,.c,.h,.cpp,.cc,.cxx,.hpp,.cs,.php,.sql,.sh,.bash,.zip,.mp3,.wav,.m4a,.ogg,.webm,.flac,image/jpeg,image/png,image/webp,audio/mpeg,audio/wav,audio/mp4,audio/ogg,audio/webm,audio/flac">
      <button class="icon" id="imageBtn" type="button" title="Dateien hochladen" aria-label="Dateien hochladen" data-i18n-attr="title:ghosty.uploadFiles;aria-label:ghosty.uploadFiles">📎</button>
      <button class="icon tool-menu-toggle" id="toolMenuToggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="toolMenu" title="Ghost AI Tools" aria-label="Ghost AI Tools">＋</button>
      <div class="tool-menu" id="toolMenu" role="menu" hidden>
        <strong data-i18n="ghosty.toolsTitle">Ghost AI Tools</strong>
        <button type="button" role="menuitemcheckbox" data-tool="web" aria-checked="false"><span>🌐</span><span data-i18n="ghosty.toolWeb">Websuche</span></button>
        <button type="button" role="menuitemcheckbox" data-tool="deepResearch" aria-checked="false"><span>🔬</span><span data-i18n="ghosty.toolDeepResearch">Deep Research</span></button>
        <button type="button" role="menuitemcheckbox" data-tool="python" aria-checked="false"><span>🧮</span><span data-i18n="ghosty.toolPython">Rechner / Python</span></button>
        <button type="button" role="menuitemcheckbox" data-tool="files" aria-checked="false"><span>📄</span><span data-i18n="ghosty.toolFiles">Dateien analysieren</span></button>
        <button type="button" role="menuitemcheckbox" data-tool="audio" aria-checked="false"><span>🎙</span><span data-i18n="ghosty.toolAudio">Audio verstehen</span></button>
        <button type="button" role="menuitemcheckbox" data-tool="ocr" aria-checked="false"><span>🔤</span><span data-i18n="ghosty.toolOcr">OCR / Text erkennen</span></button>
        <button type="button" role="menuitemcheckbox" data-tool="chart" aria-checked="false"><span>📊</span><span data-i18n="ghosty.toolChart">Diagramm erstellen</span></button>
        <button type="button" role="menuitemcheckbox" data-tool="project" aria-checked="false"><span>💻</span><span data-i18n="ghosty.toolProject">Projekt analysieren</span></button>
        <button type="button" role="menuitem" id="recordingStart"><span>🎙</span><span data-i18n="ghosty.startRecording">Aufnahme starten</span></button>
      </div>
      <textarea id="input" rows="1" placeholder="Nachricht schreiben …" data-i18n-attr="placeholder:ghosty.messagePlaceholder"></textarea>
      <button class="send" id="send" type="button" data-i18n="ghosty.send">Senden</button>
      <button class="stop-generation" id="stop" type="button" hidden aria-label="Generierung abbrechen" title="Generierung abbrechen" data-i18n-attr="aria-label:ghosty.stopGeneration;title:ghosty.stopGeneration"><span aria-hidden="true">■</span></button>
    </div>
  </main>
</div>

<aside class="language-settings" data-language-settings>
  <button class="language-settings__button" type="button" data-language-toggle aria-expanded="false" aria-controls="language-settings-panel" aria-label="Einstellungen" title="Einstellungen" data-i18n-attr="aria-label:common.settings;title:common.settings">⚙</button>
  <section class="language-settings__panel" id="language-settings-panel" data-language-panel hidden>
    <h2 data-i18n="common.settings">Einstellungen</h2>
    <label for="language-select">
      <span data-i18n="common.chooseLanguage">Sprache auswählen</span>
      <select id="language-select" data-language-select>
        <option value="de" data-i18n="common.german">Deutsch</option>
        <option value="en" data-i18n="common.english">Englisch</option>
        <option value="sv" data-i18n="common.swedish">Schwedisch</option>
        <option value="fr" data-i18n="common.french">Französisch</option>
        <option value="es" data-i18n="common.spanish">Spanisch</option>
      </select>
    </label>
  </section>
</aside>


<script id="ghosty-auth-script">
(() => {
  const nativeFetch = window.fetch.bind(window);

  const byId = id => document.getElementById(id);

  function appElement() { return byId('ghostyApp'); }
  function gateElement() { return byId('ghostyAuthGate'); }

  function hideApp() {
    appElement()?.classList.add('ghosty-auth-hidden');
  }

  function showApp() {
    gateElement()?.setAttribute('hidden', '');
    appElement()?.classList.remove('ghosty-auth-hidden');
  }

  function showLogin(message = '') {
    hideApp();
    const gate = gateElement();
    const login = byId('ghostyAuthLogin');
    const blocked = byId('ghostyAuthBlocked');
    if (gate) gate.removeAttribute('hidden');
    if (login) login.removeAttribute('hidden');
    if (blocked) blocked.setAttribute('hidden', '');
    if (byId('ghostyAuthError')) byId('ghostyAuthError').textContent = message;
    setTimeout(() => byId('ghostyAccessCode')?.focus(), 0);
  }

  function showBlocked(blockedForSeconds = 10800) {
    hideApp();

    const seconds = Math.max(1, Number(blockedForSeconds) || 10800);
    const gate = gateElement();
    const login = byId('ghostyAuthLogin');
    const blocked = byId('ghostyAuthBlocked');

    if (gate) gate.removeAttribute('hidden');
    if (login) login.setAttribute('hidden', '');
    if (blocked) blocked.removeAttribute('hidden');

    // Nach Ablauf automatisch erneut den SERVER fragen.
    // Es wird absichtlich KEINE Sperre im Browser gespeichert.
    window.setTimeout(() => {
      bootAuth();
    }, Math.min(seconds * 1000 + 1000, 2147483000));
  }

  function requestPath(input) {
    try {
      const raw = typeof input === 'string' ? input : input?.url;
      return new URL(raw, location.href).pathname;
    } catch {
      return '';
    }
  }

  // Bestehendes script.js bleibt unverändert. Dieser Wrapper reagiert nur darauf,
  // wenn eine geschützte API meldet, dass die Session nicht mehr gültig ist.
  window.fetch = async function(input, init) {
    const response = await nativeFetch(input, init);
    const path = requestPath(input);

    if (response.status === 401 && path.startsWith('/api/ai/')) {
      showLogin('Deine Sitzung ist nicht mehr gültig. Bitte melde dich erneut an.');
    }

    return response;
  };

  async function login() {
    const input = byId('ghostyAccessCode');
    const button = byId('ghostyLoginButton');
    const errorBox = byId('ghostyAuthError');
    const code = input?.value.trim() || '';

    if (!code) {
      if (errorBox) errorBox.textContent = 'Bitte gib einen Zugangscode ein.';
      return;
    }

    if (button) button.disabled = true;
    if (errorBox) errorBox.textContent = '';

    try {
      const response = await nativeFetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });

      let data = {};
      try { data = await response.json(); } catch {}

      if (response.status === 429 && data.blocked) {
        if (input) input.value = '';
        showBlocked(data.blockedForSeconds || 10800);
        return;
      }

      if (!response.ok) {
        let message = data.error || 'Anmeldung fehlgeschlagen.';
        throw new Error(message);
      }

      if (input) input.value = '';

      // Neu laden, damit dein vorhandenes umfangreiches script.js ganz normal
      // mit einer bereits gültigen Session startet.
      location.reload();
    } catch (error) {
      if (errorBox) errorBox.textContent = error.message || 'Anmeldung fehlgeschlagen.';
    } finally {
      if (button) button.disabled = false;
    }
  }

  async function logout() {
    try {
      await nativeFetch('/api/auth/logout', { method: 'POST' });
    } catch {}
    location.reload();
  }

  async function bootAuth() {
    hideApp();

    try {
      const response = await nativeFetch('/api/auth/me', {
        method: 'GET',
        cache: 'no-store'
      });

      if (!response.ok) {
        showLogin('Der Zugangsdienst ist derzeit nicht erreichbar.');
        return;
      }

      const data = await response.json();

      // MariaDB/Server ist die einzige Quelle für die IP-Sperre.
      if (data.blocked) {
        showBlocked(data.blockedForSeconds || 10800);
        return;
      }

      if (data.loggedIn) {
        showApp();
        return;
      }

      showLogin();
    } catch {
      showLogin('Der Zugangsdienst ist derzeit nicht erreichbar.');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    byId('ghostyLoginButton')?.addEventListener('click', login);
    byId('ghostyAccessCode')?.addEventListener('keydown', event => {
      if (event.key === 'Enter') login();
    });
    byId('ghostyLogout')?.addEventListener('click', logout);
    bootAuth();
  });
})();
</script>

<script src="./script.js?v=20260902-tools-v3"></script>
<script src="/assets/language-settings.js"></script>
</body>
</html>
